apiVersion: v1
kind: Pod
metadata:
  name: modex-transfer
  namespace: usd-djha
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: alpine:3.19
      command: ["sh", "-c", "apk add --no-cache tar && sleep infinity"]
      volumeMounts:
        - name: modex
          mountPath: /mnt/modex
      resources:
        requests:
          cpu: "500m"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
  volumes:
    - name: modex
      persistentVolumeClaim:
        claimName: modex-data
