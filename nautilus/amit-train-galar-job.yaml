# amit-train-galar-job.yaml
#
# Same run as train-galar-job.yaml (section, fold 0, 256px, batch 64, 50 epochs,
# same code and results), with one change: frames are read from the GALAR .tar
# shards through the prebuilt index (--tar_index) instead of from the extracted
# PNGs on three PVCs. image_dir is only used for frames that are not in any shard.
#
# Reads:  bpil-galar-pvc  (/galar, read-only)  shards + splits_publication
#         bpil-amit-pvc   (/pvc,   read-only)  results/galar_tar_index.pkl only, loaded once
# Writes: modex-results:/amit/modex-galar/{results_modex_galar,models_modex_galar}/
#         plus train.log there.
#
# Submit: kubectl apply -f nautilus/amit-train-galar-job.yaml -n usd-djha
# Logs:   kubectl logs -f job/amit-modex-galar-section-fold0 -n usd-djha
apiVersion: batch/v1
kind: Job
metadata:
  name: amit-modex-galar-section-fold0
  namespace: usd-djha
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # A40 / L40 class only (48 GB): ~2x an A10 for this model
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-L40S
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nautilus-ext-gpu01.fullerton.edu
                      - hcc-nrp-shor-c5809.unl.edu   # nvidia-smi: "No devices were found" (2026-09-25)
                      - hcc-nrp-shor-c6017.unl.edu   # CUDA illegal memory access on first step (2026-09-25)
      tolerations:
        - { key: "nvidia.com/gpu", operator: "Exists", effect: "NoSchedule" }
      containers:
        - name: train
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          env:
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: PIP_NO_CACHE_DIR, value: "1" }
            - { name: REPO, value: "https://github.com/regmismriti/galar-modex.git" }
            - { name: BRANCH, value: "amit" }
            - name: GITHUB_PAT
              valueFrom:
                { secretKeyRef: { name: github-pat, key: token, optional: true } }
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              apt-get update -qq && apt-get install -y -q git > /dev/null
              URL="$REPO"
              if [ -n "${GITHUB_PAT:-}" ]; then URL=$(echo "$REPO" | sed "s|https://|https://${GITHUB_PAT}@|"); fi
              git clone --branch "$BRANCH" --depth 1 "$URL" /workspace/galar-modex
              cd /workspace/galar-modex && echo "code at $(git rev-parse --short HEAD)"
              pip install --no-cache-dir tqdm scikit-learn pillow pandas
              mkdir -p /out/amit/modex-galar
              nvidia-smi --query-gpu=name,memory.total --format=csv | tee -a /out/amit/modex-galar/train.log
              python -u main_galar_c.py \
                --tar_index /pvc/results/galar_tar_index.pkl \
                --shard_dir /galar/galar/shards \
                --image_dir /galar/galar/frames \
                --split_path /galar/galar/splits_publication \
                --training_features section \
                --fold 0 \
                --image_size 256 \
                --batch_size 64 \
                --num_workers 8 \
                --num_epochs 50 \
                --output_dir /out/amit/modex-galar 2>&1 | tee -a /out/amit/modex-galar/train.log
          resources:
            requests: { cpu: "12", memory: "32Gi", nvidia.com/gpu: "1" }
            limits:   { cpu: "12", memory: "32Gi", nvidia.com/gpu: "1" }
          volumeMounts:
            - { name: galar,     mountPath: /galar, readOnly: true }
            - { name: index,     mountPath: /pvc,   readOnly: true }   # tar index only, read once at start
            - { name: out,       mountPath: /out }
            - { name: workspace, mountPath: /workspace }
            - { name: dshm,      mountPath: /dev/shm }
      volumes:
        - name: galar
          persistentVolumeClaim: { claimName: bpil-galar-pvc }
        - name: index
          persistentVolumeClaim: { claimName: bpil-amit-pvc }
        - name: out
          persistentVolumeClaim: { claimName: modex-results }
        - name: workspace
          emptyDir: {}
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
