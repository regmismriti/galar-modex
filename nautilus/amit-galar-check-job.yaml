# amit-galar-check-job.yaml
#
# CPU-only, run before amit-train-galar-job.yaml. No GPU, no training.
#  1. Builds the tar index from the shards on bpil-galar-pvc into
#     modex-galar-out:/amit/galar_tar_index.pkl (skipped if it already exists;
#     reads tar headers only, roughly 30-90 min the first time).
#  2. Builds train/val/test exactly as training would and prints the split folders,
#     per-video counts of frames read from the tar shards / from image_dir / not
#     found, class counts per split, decodes a few frames and times the DataLoader.
#
# Reads:  bpil-galar-pvc  (/galar, read-only)  shards + splits_publication
# Writes: modex-galar-out (/out)  /amit/galar_tar_index.pkl, /amit/modex-galar/check.log
#
# Submit: kubectl apply -f nautilus/amit-galar-check-job.yaml -n usd-djha
# Logs:   kubectl logs -f job/amit-modex-galar-check -n usd-djha
apiVersion: batch/v1
kind: Job
metadata:
  name: amit-modex-galar-check
  namespace: usd-djha
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          env:
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: PIP_NO_CACHE_DIR, value: "1" }
            - { name: REPO, value: "https://github.com/regmismriti/galar-modex.git" }
            - { name: BRANCH, value: "amit" }
            - name: GITHUB_PAT
              valueFrom:
                { secretKeyRef: { name: github-pat, key: token, optional: true } }
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              apt-get update -qq && apt-get install -y -q git > /dev/null
              URL="$REPO"
              if [ -n "${GITHUB_PAT:-}" ]; then URL=$(echo "$REPO" | sed "s|https://|https://${GITHUB_PAT}@|"); fi
              git clone --branch "$BRANCH" --depth 1 "$URL" /workspace/galar-modex
              cd /workspace/galar-modex && echo "code at $(git rev-parse --short HEAD)"
              pip install -q tqdm scikit-learn pillow pandas
              mkdir -p /out/amit/modex-galar
              python -u build_galar_tar_index.py \
                --shards_dir /galar/galar/shards \
                --out /out/amit/galar_tar_index.pkl 2>&1 | tee /out/amit/modex-galar/index.log
              python -u check_galar_tar.py \
                --tar_index /out/amit/galar_tar_index.pkl \
                --shard_dir /galar/galar/shards \
                --image_dir /galar/galar/frames \
                --split_path /galar/galar/splits_publication \
                --training_features section \
                --fold 0 \
                --image_size 256 \
                --batch_size 64 \
                --num_workers 8 2>&1 | tee /out/amit/modex-galar/check.log
          resources:
            requests: { cpu: "8", memory: "16Gi" }
            limits:   { cpu: "8", memory: "19Gi" }   # <= 1.2x request
          volumeMounts:
            - { name: galar,     mountPath: /galar, readOnly: true }
            - { name: out,       mountPath: /out }
            - { name: workspace, mountPath: /workspace }
            - { name: dshm,      mountPath: /dev/shm }
      volumes:
        - name: galar
          persistentVolumeClaim: { claimName: bpil-galar-pvc }
        - name: out
          persistentVolumeClaim: { claimName: modex-galar-out }
        - name: workspace
          emptyDir: {}
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 4Gi }
